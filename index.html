<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AA Study Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Crimson+Pro:wght@300;400;500;600;700&family=Pinyon+Script&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="v2.css?v=literature-menu" />
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>
  </div>

  <div class="app-shell">
    <header class="app-header slim">
      <div class="top-bar">
        <div class="brand-mark">AA Study Library</div>
        <nav id="topNav" class="top-nav" aria-label="Library">
          <details id="literatureMenu">
            <summary class="nav-item">Literature</summary>
            <div id="literatureList"></div>
          </details>
          <button id="navDictionary" class="nav-item" type="button" data-source="dictionary">Dictionary</button>
        </nav>
        <details class="library-tools">
          <summary>Search &amp; tools</summary>
    <section class="toolbar">
      <form id="searchForm" class="search-bar" autocomplete="off">
        <input id="searchInput" aria-label="Search across the library" type="search" placeholder="Search across the library" />
        <button class="primary" type="submit">Search</button>
        <button id="clearSearchBtn" class="ghost" type="button">Clear</button>
      </form>
      <div class="toolbar-right">
        <div id="searchSummary" class="search-summary">Search across all sources.</div>
        <div id="statusLine" class="status-pill">Loading library...</div>
        <div class="data-actions">
          <button id="refreshBtn" class="ghost" type="button">Refresh</button>
          <label class="file-btn">
            Choose data folder
            <input id="folderInput" type="file" webkitdirectory directory multiple />
          </label>
          <label class="file-btn ghost">
            Choose JSON files
            <input id="fileInput" type="file" accept=".json" multiple />
          </label>
        </div>
        <div id="localFallback" class="local-fallback hidden">
          <p id="localFallbackMessage" class="panel-note"></p>
        </div>
      </div>
    </section>
        </details>
      </div>
    </header>

    <section id="dropdownArea" class="dropdown-area">
      <div id="dropdownDictionary" class="dropdown-panel" aria-label="Dictionary contents">
        <div class="dropdown-header">Dictionary</div>
        <div id="dictionaryList" class="dropdown-list"></div>
      </div>
    </section>


    <main class="content-grid">
      <section class="panel reader">
        <div class="reader-header">
          <div class="reader-kicker" id="activeKicker"></div>
          <h2 id="activeTitle" class="reader-title">Loading reading…</h2>
          <div id="activeMeta" class="reader-meta"></div>
        </div>
        <article id="content" class="reader-content" tabindex="0"></article>
      </section>

      <aside class="panel results">
        <div class="panel-header">
          <h2>Search Results</h2>
        </div>
        <div id="resultsList" class="results-list"></div>
      </aside>
    </main>
  </div>

  <noscript class="noscript">This app needs JavaScript enabled to load the library.</noscript>
  <script src="app.js"></script>
  <script src="source-adapters.js"></script>
  <script src="reading-books.js?v=literature-menu"></script>
  <script src="v2.js"></script>
  <script src="study-lens.js"></script>
</body>
</html>
